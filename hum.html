<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AOI HUM-60 | Voice to MIDI Workstation</title>
  <style>
    :root {
      --bg-dark: #121316;
      --panel-bg: #1c1d22;
      --panel-border: #2a2c33;
      --lcd-bg: #0d1e18;
      --lcd-text: #5af0ad;
      --lcd-dim: #1e523c;
      --accent-blue: #3a86ff;
      --accent-orange: #f77f00;
      --accent-red: #d90429;
      --accent-yellow: #ffb703;
      --text-main: #f0f2f5;
      --text-muted: #8b92a0;
      --pad-base: #282a30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding-top: max(52px, env(safe-area-inset-top, 52px));
      padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      padding-left: max(16px, env(safe-area-inset-left, 16px));
      padding-right: max(16px, env(safe-area-inset-right, 16px));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand-logo {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1.5px;
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(58, 134, 255, 0.4);
    }

    .brand-model {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #cbd5e1;
    }

    .sub-tag {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .nav-link {
      font-size: 12px;
      color: var(--accent-blue);
      text-decoration: none;
      background: rgba(58, 134, 255, 0.12);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(58, 134, 255, 0.3);
      font-weight: 600;
    }

    /* BPM & Metronome Bar */
    .bpm-metronome-bar {
      background: #18191e;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bpm-control-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bpm-label {
      font-family: monospace;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .bpm-input {
      width: 58px;
      background: #0f1013;
      border: 1px solid #333640;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      font-family: monospace;
      text-align: center;
      padding: 4px;
      border-radius: 6px;
      outline: none;
    }

    .btn-tap {
      background: #2b2e38;
      border: 1px solid #444754;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-tap:active {
      background: var(--accent-orange);
      color: #fff;
    }

    .auto-bpm-pill {
      font-family: monospace;
      font-size: 11px;
      color: #5af0ad;
      background: rgba(90, 240, 173, 0.12);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px dashed rgba(90, 240, 173, 0.4);
      display: none;
      cursor: pointer;
    }

    .click-toggle-label {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .click-toggle-label input {
      accent-color: var(--accent-orange);
    }

    /* 4-beat LED Metronome */
    .metronome-leds {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .metro-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #1b2621;
      border: 1px solid #143525;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-family: monospace;
      font-weight: 700;
      color: #2e4f3f;
      transition: all 0.05s ease-out;
    }

    .metro-dot.flash-down {
      background: var(--accent-yellow);
      border-color: #ffd166;
      box-shadow: 0 0 12px var(--accent-yellow);
      color: #000;
      transform: scale(1.18);
    }

    .metro-dot.flash-sub {
      background: var(--lcd-text);
      border-color: #5af0ad;
      box-shadow: 0 0 8px var(--lcd-text);
      color: #000;
      transform: scale(1.1);
    }

    /* Live Tuner & Waveform Screen */
    .lcd-screen {
      background: var(--lcd-bg);
      border: 2px solid #16382a;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.7), 0 0 15px rgba(90, 240, 173, 0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    /* Count-in Overlay */
    .count-in-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(13, 30, 24, 0.94);
      border-radius: 10px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 4px;
    }

    .count-in-label {
      font-family: monospace;
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-yellow);
      letter-spacing: 2px;
    }

    .count-in-number {
      font-family: "Courier New", monospace;
      font-size: 72px;
      font-weight: 900;
      color: #5af0ad;
      text-shadow: 0 0 20px rgba(90, 240, 173, 0.8);
      line-height: 1;
    }

    .lcd-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 11px;
      color: var(--lcd-dim);
      letter-spacing: 1px;
    }

    #mic-status {
      font-weight: bold;
      color: var(--lcd-text);
    }

    .bar-beat-tag {
      font-family: monospace;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-orange);
      background: rgba(247, 127, 0, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .tuner-display {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 2px 0;
    }

    .pitch-note {
      font-size: 46px;
      font-weight: 900;
      font-family: "Courier New", monospace;
      color: var(--lcd-text);
      text-shadow: 0 0 12px rgba(90, 240, 173, 0.6);
      min-width: 90px;
      text-align: center;
    }

    .pitch-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .freq-text {
      font-family: monospace;
      font-size: 15px;
      color: var(--lcd-text);
      font-weight: 700;
    }

    .cents-text {
      font-family: monospace;
      font-size: 12px;
      color: #7ef2bb;
    }

    /* Input Level Meter */
    .level-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
      font-size: 10px;
      color: var(--lcd-dim);
    }

    .level-bar-wrap {
      flex: 1;
      height: 6px;
      background: #081410;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #16382a;
    }

    .level-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5af0ad, #ffb703, #d90429);
      transition: width 0.05s ease-out;
    }

    /* Cents Meter Bar */
    .cents-bar-wrap {
      width: 100%;
      height: 8px;
      background: #081410;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      border: 1px solid #16382a;
    }

    .cents-center-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #5af0ad;
      transform: translateX(-50%);
      z-index: 2;
    }

    .cents-pointer {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      background: var(--accent-orange);
      border-radius: 4px;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.05s ease-out;
      box-shadow: 0 0 6px var(--accent-orange);
    }

    /* Waveform Canvas */
    .wave-canvas {
      width: 100%;
      height: 38px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      display: block;
    }

    /* Control Buttons */
    .control-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .btn-rec {
      background: linear-gradient(145deg, #d90429, #ef233c);
      color: #fff;
    }

    .btn-rec.recording {
      background: linear-gradient(145deg, #f77f00, #ffb703);
      animation: pulse-rec 1s infinite alternate;
    }

    @keyframes pulse-rec {
      from { filter: brightness(1); }
      to { filter: brightness(1.25); box-shadow: 0 0 16px rgba(247, 127, 0, 0.7); }
    }

    .btn-play-synth {
      background: linear-gradient(145deg, #3a86ff, #2563eb);
      color: #fff;
    }

    .btn-play-synth.playing {
      background: linear-gradient(145deg, #06d6a0, #059669);
    }

    .btn-play-synth:disabled, .btn-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }

    /* Speaker Tip */
    .speaker-tip {
      font-size: 11px;
      color: #94a3b8;
      background: #18191f;
      border: 1px solid #2d3039;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Settings & Quantize */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .setting-box {
      background: #22242b;
      border: 1px solid #2d3039;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .setting-select {
      background: #16171b;
      border: 1px solid #333640;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px;
      border-radius: 6px;
      outline: none;
    }

    /* Piano Roll Canvas & Timeline */
    .pianoroll-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-demo {
      font-size: 11px;
      background: #2b2e38;
      color: #94a3b8;
      border: 1px solid #3e4250;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-demo:active {
      background: #3e4250;
    }

    .stats-badge {
      font-family: monospace;
      font-size: 12px;
      color: var(--accent-yellow);
      background: rgba(255, 183, 3, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .pianoroll-wrap {
      position: relative;
      width: 100%;
      height: 180px;
      background: #15161a;
      border: 1px solid #23252c;
      border-radius: 8px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    #pianoroll-canvas {
      display: block;
      height: 100%;
    }

    .notes-list-preview {
      font-family: monospace;
      font-size: 11px;
      color: #94a3b8;
      max-height: 50px;
      overflow-y: auto;
      background: #141518;
      padding: 6px 8px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Export Bar */
    .export-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-export-midi {
      background: linear-gradient(145deg, #ffb703, #fb8500);
      color: #000;
      border: none;
      border-radius: 10px;
      height: 48px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(251, 133, 0, 0.35);
      transition: transform 0.08s ease;
    }

    .btn-export-midi:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-export-midi:active:not(:disabled) {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Header -->
    <header class="header-bar">
      <div class="brand-group">
        <span class="brand-logo">AOI</span>
        <span class="brand-model">HUM-60</span>
        <span class="sub-tag">VOICE TO MIDI</span>
      </div>
      <a href="index.html" class="nav-link">← LOB60 サンプラー</a>
    </header>

    <!-- BPM & Metronome Bar -->
    <section class="bpm-metronome-bar">
      <div class="bpm-control-box">
        <span class="bpm-label">BPM:</span>
        <input type="number" id="bpm-input" value="120" min="50" max="220" class="bpm-input">
        <button id="btn-tap" class="btn-tap" title="タップしてテンポ指定">TAP</button>
        <span id="auto-bpm-pill" class="auto-bpm-pill" title="クリックして適用">推定: 120 適用</span>
      </div>

      <label class="click-toggle-label">
        <input type="checkbox" id="click-audio-chk">
        <span>クリック音 (イヤホン)</span>
      </label>

      <div class="metronome-leds">
        <div class="metro-dot" id="dot-1">1</div>
        <div class="metro-dot" id="dot-2">2</div>
        <div class="metro-dot" id="dot-3">3</div>
        <div class="metro-dot" id="dot-4">4</div>
      </div>
    </section>

    <!-- Tuner & Waveform Screen -->
    <section class="lcd-screen">
      <!-- 4-Beat Pre-count Banner -->
      <div class="count-in-banner" id="count-in-banner">
        <div class="count-in-label">COUNT IN</div>
        <div class="count-in-number" id="count-in-num">4</div>
      </div>

      <div class="lcd-header">
        <span>TUNER & PITCH TRACKER</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="bar-beat-tag" id="bar-beat-display" style="display:none;">BAR 1 : 1</span>
          <span id="mic-status">MIC: STANDBY (タップして開始)</span>
        </div>
      </div>

      <div class="tuner-display">
        <div class="pitch-note" id="note-display">--</div>
        <div class="pitch-info">
          <div class="freq-text" id="freq-display">0.0 Hz</div>
          <div class="cents-text" id="cents-display">±0 cents</div>
        </div>
      </div>

      <!-- Input Level Meter -->
      <div class="level-row">
        <span>INPUT LVL</span>
        <div class="level-bar-wrap">
          <div class="level-bar-fill" id="level-bar"></div>
        </div>
        <span id="level-text">0%</span>
      </div>

      <!-- Cents deviation meter -->
      <div class="cents-bar-wrap">
        <div class="cents-center-line"></div>
        <div class="cents-pointer" id="cents-pointer"></div>
      </div>

      <!-- Live audio wave -->
      <canvas class="wave-canvas" id="wave-canvas"></canvas>
    </section>

    <!-- Control Buttons -->
    <section class="control-deck">
      <button class="btn-action btn-rec" id="btn-rec">
        <span id="rec-dot">●</span> <span id="rec-text">鼻歌を録音 (4カウント)</span>
      </button>
      <button class="btn-action btn-play-synth" id="btn-play" disabled>
        <span>►</span> <span id="play-text">シンセで再生</span>
      </button>
    </section>

    <!-- Speaker Tip -->
    <div class="speaker-tip">
      <span>📢</span>
      <span>iPhoneで音が鳴らない時は、本体横の<strong>消音スイッチ（マナーモード）をOFF</strong>にして音量を上げてください。</span>
    </div>

    <!-- Settings: Synth Sound, Scale, Quantize -->
    <section class="settings-grid">
      <div class="setting-box">
        <label class="setting-label">シンセ音色</label>
        <select class="setting-select" id="synth-sound">
          <option value="analog">アナログ・リード (Moog風)</option>
          <option value="rhodes">エレピ / Rhodes風</option>
          <option value="brass">80s シンセ・ブラス</option>
          <option value="flute">ピュア・フルート / 口笛</option>
        </select>
      </div>

      <div class="setting-box">
        <label class="setting-label">音階スケール固定</label>
        <select class="setting-select" id="scale-snap">
          <option value="chromatic">全半音 (クロマチック)</option>
          <option value="major">C Major (ドレミファソラシ)</option>
          <option value="minor">A Minor (自然短音階)</option>
          <option value="pentatonic">マイナー・ペンタトニック</option>
        </select>
      </div>

      <div class="setting-box">
        <label class="setting-label">BPMグリッド揃え (クオンタイズ)</label>
        <select class="setting-select" id="grid-quantize">
          <option value="8th" selected>8分音符グリッド (推奨)</option>
          <option value="16th">16分音符グリッド (細かめ)</option>
          <option value="4th">4分音符グリッド (ゆったり)</option>
          <option value="none">オフ (自然な鼻歌タイミング)</option>
        </select>
      </div>

      <div class="setting-box">
        <label class="setting-label">予備拍カウントイン</label>
        <select class="setting-select" id="count-in-select">
          <option value="4" selected>4カウント (1小節)</option>
          <option value="0">カウントなし (すぐ録音)</option>
        </select>
      </div>
    </section>

    <!-- Piano Roll Display -->
    <section class="pianoroll-card">
      <div class="card-header">
        <span class="card-title">PIANO ROLL & 検出ノート</span>
        <div class="header-actions">
          <button class="btn-demo" id="btn-demo">♪ デモ鼻歌で試す</button>
          <span class="stats-badge" id="stats-badge">0 ノート</span>
        </div>
      </div>

      <div class="pianoroll-wrap" id="pianoroll-wrap">
        <canvas id="pianoroll-canvas" width="600" height="180"></canvas>
      </div>

      <div class="notes-list-preview" id="notes-preview">録音ボタンを押すとマイクが即座に起動し、4カウント後にゼロラグで録音開始します！</div>
    </section>

    <!-- Export Area -->
    <section class="export-box">
      <button class="btn-export-midi" id="btn-export" disabled>
        <span>⬇</span> <span>MIDIファイルを書き出し (.mid)</span>
      </button>
    </section>

  </div>

  <script>
    (function () {
      let audioCtx = null;
      let analyser = null;
      let micStream = null;
      let micSource = null;
      let silentSink = null;
      let inputGain = null;
      let isRecording = false;
      let isCountingIn = false;
      let isPlaying = false;
      let animId = null;
      let metroTimer = null;
      let currentMetroBeat = 0;
      let currentBar = 1;
      let activeAudioEl = null;

      let state = {
        bpm: 120,
        estimatedBpm: 120
      };

      const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
      
      let recordedFrames = [];
      let detectedNotes = [];
      let recordStartTime = 0;

      // DOM Elements
      const bpmInput = document.getElementById('bpm-input');
      const btnTap = document.getElementById('btn-tap');
      const autoBpmPill = document.getElementById('auto-bpm-pill');
      const clickAudioChk = document.getElementById('click-audio-chk');
      const countInBanner = document.getElementById('count-in-banner');
      const countInNum = document.getElementById('count-in-num');
      const barBeatDisplay = document.getElementById('bar-beat-display');
      const countInSelect = document.getElementById('count-in-select');
      const gridQuantize = document.getElementById('grid-quantize');
      const metroDots = [
        document.getElementById('dot-1'),
        document.getElementById('dot-2'),
        document.getElementById('dot-3'),
        document.getElementById('dot-4')
      ];

      const noteDisplay = document.getElementById('note-display');
      const freqDisplay = document.getElementById('freq-display');
      const centsDisplay = document.getElementById('cents-display');
      const centsPointer = document.getElementById('cents-pointer');
      const micStatus = document.getElementById('mic-status');
      const levelBar = document.getElementById('level-bar');
      const levelText = document.getElementById('level-text');
      const waveCanvas = document.getElementById('wave-canvas');
      const waveCtx = waveCanvas.getContext('2d');
      const btnRec = document.getElementById('btn-rec');
      const recText = document.getElementById('rec-text');
      const btnPlay = document.getElementById('btn-play');
      const playText = document.getElementById('play-text');
      const btnExport = document.getElementById('btn-export');
      const btnDemo = document.getElementById('btn-demo');
      const synthSound = document.getElementById('synth-sound');
      const scaleSnap = document.getElementById('scale-snap');
      const statsBadge = document.getElementById('stats-badge');
      const notesPreview = document.getElementById('notes-preview');
      const pianoCanvas = document.getElementById('pianoroll-canvas');
      const pianoCtx = pianoCanvas.getContext('2d');

      // 1. High Precision Web Audio Click Synthesizer
      function scheduleClickSound(time, isDownbeat) {
        if (!clickAudioChk.checked || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(isDownbeat ? 1200 : 800, time);
          gain.gain.setValueAtTime(0.3, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(time);
          osc.stop(time + 0.05);
        } catch (e) {}
      }

      function flashDot(dotIdx, isDownbeat) {
        metroDots.forEach((d, idx) => {
          if (idx === dotIdx) {
            d.classList.add(isDownbeat ? 'flash-down' : 'flash-sub');
            setTimeout(() => d.classList.remove('flash-down', 'flash-sub'), 120);
          } else {
            d.classList.remove('flash-down', 'flash-sub');
          }
        });
      }

      // Metronome Loop for Recording & Playback
      function startMetronome() {
        stopMetronome();
        currentMetroBeat = 0;
        currentBar = 1;
        barBeatDisplay.style.display = 'inline-block';
        tickMetronome();
      }

      function stopMetronome() {
        clearTimeout(metroTimer);
        metroDots.forEach(d => {
          d.classList.remove('flash-down', 'flash-sub');
        });
        barBeatDisplay.style.display = 'none';
      }

      function tickMetronome() {
        const beatInterval = (60.0 / state.bpm) * 1000;
        const isDown = (currentMetroBeat === 0);

        flashDot(currentMetroBeat, isDown);
        barBeatDisplay.textContent = `BAR ${currentBar} : ${currentMetroBeat + 1}`;
        scheduleClickSound(audioCtx ? audioCtx.currentTime : 0, isDown);

        currentMetroBeat++;
        if (currentMetroBeat >= 4) {
          currentMetroBeat = 0;
          currentBar++;
        }

        metroTimer = setTimeout(tickMetronome, beatInterval);
      }

      // Tap Tempo Logic
      let tapTimes = [];
      btnTap.onclick = () => {
        const now = performance.now();
        tapTimes.push(now);
        if (tapTimes.length > 4) tapTimes.shift();

        if (tapTimes.length >= 2) {
          const diffs = [];
          for (let i = 1; i < tapTimes.length; i++) {
            diffs.push(tapTimes[i] - tapTimes[i - 1]);
          }
          const avgDiff = diffs.reduce((a, b) => a + b, 0) / diffs.length;
          const calculatedBpm = Math.round(60000 / avgDiff);
          if (calculatedBpm >= 50 && calculatedBpm <= 220) {
            state.bpm = calculatedBpm;
            bpmInput.value = calculatedBpm;
          }
        }
      };

      bpmInput.onchange = () => {
        const val = parseInt(bpmInput.value, 10);
        if (!isNaN(val) && val >= 50 && val <= 220) {
          state.bpm = val;
        } else {
          bpmInput.value = state.bpm;
        }
      };

      autoBpmPill.onclick = () => {
        state.bpm = state.estimatedBpm;
        bpmInput.value = state.bpm;
        autoBpmPill.style.display = 'none';
        if (recordedFrames.length > 0) processFramesToNotes();
      };

      // 2. Microphone & ZERO-LAG Count-in Engine
      async function ensureAudioContext() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) {
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        return audioCtx;
      }

      async function triggerRecordAction() {
        if (isRecording || isCountingIn) {
          stopRecording();
          return;
        }

        micStatus.textContent = 'MIC: マイク接続中...';
        micStatus.style.color = '#ffb703';

        // 1. OPEN MIC STREAM IMMEDIATELY UPON TAP!
        try {
          await ensureAudioContext();
          if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
        } catch (err) {
          micStatus.textContent = 'MIC: 権限エラー';
          alert('マイクへのアクセスが許可されませんでした。Safariの設定を確認してください。');
          return;
        }

        // Setup audio graph
        try {
          if (!micSource) {
            micSource = audioCtx.createMediaStreamSource(micStream);
            inputGain = audioCtx.createGain();
            inputGain.gain.value = 2.5;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.05;

            silentSink = audioCtx.createGain();
            silentSink.gain.value = 0.0;

            micSource.connect(inputGain);
            inputGain.connect(analyser);
            analyser.connect(silentSink);
            silentSink.connect(audioCtx.destination);
          }
        } catch (err) {
          console.error('Audio node setup err:', err);
        }

        // 2. Mic is now active and warm!
        // Start waveform and level meter monitoring immediately
        trackPitchLoop();

        const countInBeats = parseInt(countInSelect.value, 10);
        const beatSec = 60.0 / state.bpm;

        if (countInBeats > 0) {
          isCountingIn = true;
          countInBanner.style.display = 'flex';
          btnRec.classList.add('recording');
          recText.textContent = 'カウントイン中... (STOP)';
          micStatus.textContent = `MIC: ${countInBeats}カウント後に録音開始`;
          micStatus.style.color = '#ffb703';

          const startAudioTime = audioCtx.currentTime;
          const recStartTime = startAudioTime + countInBeats * beatSec;

          // Schedule exact audio clicks and visual numbers
          for (let b = 0; b < countInBeats; b++) {
            const beatTime = startAudioTime + b * beatSec;
            const countNum = b + 1; // 1, 2, 3, 4
            
            scheduleClickSound(beatTime, b === 0);

            const delayMs = Math.max(0, (beatTime - audioCtx.currentTime) * 1000);
            setTimeout(() => {
              if (!isCountingIn) return;
              countInNum.textContent = countNum;
              flashDot(b % 4, b === 0);
            }, delayMs);
          }

          // Exact downbeat trigger: ZERO HARDWARE DELAY!
          const recStartDelayMs = Math.max(0, (recStartTime - audioCtx.currentTime) * 1000);
          setTimeout(() => {
            if (!isCountingIn) return;
            isCountingIn = false;
            countInBanner.style.display = 'none';

            // ZERO-LAG RECORDING COMMENCES!
            recordedFrames = [];
            detectedNotes = [];
            recordStartTime = recStartTime;
            isRecording = true;

            recText.textContent = '録音停止 (STOP)';
            micStatus.textContent = 'MIC: 録音中（テンポに合わせて歌ってください）';
            micStatus.style.color = '#f77f00';
            btnPlay.disabled = true;
            btnExport.disabled = true;

            startMetronome();
          }, recStartDelayMs);

        } else {
          // Zero count-in, immediate recording
          recordedFrames = [];
          detectedNotes = [];
          recordStartTime = audioCtx.currentTime;
          isRecording = true;

          btnRec.classList.add('recording');
          recText.textContent = '録音停止 (STOP)';
          micStatus.textContent = 'MIC: 録音中（声を出してください）';
          micStatus.style.color = '#f77f00';
          btnPlay.disabled = true;
          btnExport.disabled = true;

          startMetronome();
        }
      }

      function stopRecording() {
        isCountingIn = false;
        countInBanner.style.display = 'none';
        isRecording = false;
        stopMetronome();

        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
          micSource = null;
        }
        if (silentSink) {
          try { silentSink.disconnect(); } catch (e) {}
          silentSink = null;
        }

        btnRec.classList.remove('recording');
        recText.textContent = '鼻歌を録音 (4カウント)';
        micStatus.textContent = 'MIC: 解析完了';
        micStatus.style.color = '#5af0ad';
        levelBar.style.width = '0%';
        levelText.textContent = '0%';

        processFramesToNotes();
      }

      function detectPitch(buf, sampleRate) {
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        let rms = Math.sqrt(sum / buf.length);
        if (rms < 0.006) return { freq: -1, rms };

        const minTau = Math.floor(sampleRate / 900);
        const maxTau = Math.floor(sampleRate / 65);
        const W = buf.length - maxTau;

        let sumSq0 = 0;
        for (let j = 0; j < W; j++) sumSq0 += buf[j] * buf[j];

        let nsdf = [];
        for (let tau = minTau; tau < maxTau; tau++) {
          let num = 0;
          let sumSqTau = 0;
          for (let j = 0; j < W; j++) {
            num += buf[j] * buf[j + tau];
            sumSqTau += buf[j + tau] * buf[j + tau];
          }
          let den = sumSq0 + sumSqTau;
          nsdf[tau] = den > 0 ? (2.0 * num / den) : 0;
        }

        let peaks = [];
        for (let tau = minTau + 1; tau < maxTau - 1; tau++) {
          if (nsdf[tau] > nsdf[tau - 1] && nsdf[tau] > nsdf[tau + 1] && nsdf[tau] >= 0.55) {
            peaks.push({ tau, val: nsdf[tau] });
          }
        }

        if (peaks.length === 0) return { freq: -1, rms };

        let maxVal = Math.max(...peaks.map(p => p.val));
        let bestPeak = peaks.find(p => p.val >= maxVal * 0.82) || peaks[0];
        let bestTau = bestPeak.tau;

        let y1 = nsdf[bestTau - 1];
        let y2 = nsdf[bestTau];
        let y3 = nsdf[bestTau + 1];
        let denom = 2 * (2 * y2 - y1 - y3);
        let refinedTau = denom !== 0 ? (bestTau + (y3 - y1) / denom) : bestTau;

        let freq = sampleRate / refinedTau;
        return { freq, rms };
      }

      function freqToMidi(f) {
        return 69 + 12 * Math.log2(f / 440);
      }

      function midiToFreq(m) {
        return 440 * Math.pow(2, (m - 69) / 12);
      }

      function midiToNoteName(m) {
        const note = Math.round(m);
        const name = NOTE_NAMES[((note % 12) + 12) % 12];
        const oct = Math.floor(note / 12) - 1;
        return name + oct;
      }

      function trackPitchLoop() {
        if (!isRecording && !isCountingIn) return;

        const buf = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buf);

        const { freq, rms } = detectPitch(buf, audioCtx.sampleRate);
        drawWaveform(buf);

        const lvlPct = Math.min(100, Math.round(rms * 400));
        levelBar.style.width = lvlPct + '%';
        levelText.textContent = lvlPct + '%';

        if (freq > 0) {
          const exactMidi = freqToMidi(freq);
          const roundedMidi = Math.round(exactMidi);
          const cents = Math.round((exactMidi - roundedMidi) * 100);
          const noteName = midiToNoteName(roundedMidi);

          noteDisplay.textContent = noteName;
          freqDisplay.textContent = freq.toFixed(1) + ' Hz';
          centsDisplay.textContent = (cents >= 0 ? '+' : '') + cents + ' cents';

          const clampCents = Math.max(-50, Math.min(50, cents));
          centsPointer.style.left = (50 + clampCents) + '%';

          if (isRecording) {
            const now = audioCtx.currentTime - recordStartTime;
            recordedFrames.push({ time: Math.max(0, now), midi: roundedMidi, exactMidi, freq, rms });
          }
        } else {
          centsPointer.style.left = '50%';
          if (isRecording) {
            const now = audioCtx.currentTime - recordStartTime;
            recordedFrames.push({ time: Math.max(0, now), midi: null, exactMidi: null, freq: 0, rms });
          }
        }

        requestAnimationFrame(trackPitchLoop);
      }

      function drawWaveform(buf) {
        waveCanvas.width = waveCanvas.clientWidth * window.devicePixelRatio;
        waveCanvas.height = waveCanvas.clientHeight * window.devicePixelRatio;
        const w = waveCanvas.width;
        const h = waveCanvas.height;
        waveCtx.clearRect(0, 0, w, h);

        waveCtx.lineWidth = 2 * window.devicePixelRatio;
        waveCtx.strokeStyle = '#5af0ad';
        waveCtx.beginPath();

        const sliceW = w / buf.length;
        let x = 0;
        for (let i = 0; i < buf.length; i++) {
          const v = buf[i];
          const y = (v + 1) / 2 * h;
          if (i === 0) waveCtx.moveTo(x, y);
          else waveCtx.lineTo(x, y);
          x += sliceW;
        }
        waveCtx.stroke();
      }

      // 3. Process Frames & Quantize to BPM Grid
      function processFramesToNotes() {
        if (recordedFrames.length === 0) {
          notesPreview.textContent = '音声フレームが記録されませんでした。もう一度試してください。';
          return;
        }

        const scaleMode = scaleSnap.value;
        const rawNotes = [];
        let curNote = null;
        const minDuration = 0.08;

        for (let i = 0; i < recordedFrames.length; i++) {
          const frame = recordedFrames[i];
          if (frame.midi !== null) {
            let snappedMidi = snapToScale(frame.midi, scaleMode);

            if (curNote && curNote.pitch === snappedMidi) {
              curNote.duration = frame.time - curNote.start;
            } else {
              if (curNote && curNote.duration >= minDuration) {
                rawNotes.push(curNote);
              }
              curNote = {
                start: frame.time,
                duration: 0.05,
                pitch: snappedMidi,
                noteName: midiToNoteName(snappedMidi),
                vel: 95
              };
            }
          } else {
            if (curNote) {
              if (curNote.duration >= minDuration) {
                rawNotes.push(curNote);
              }
              curNote = null;
            }
          }
        }
        if (curNote && curNote.duration >= minDuration) {
          rawNotes.push(curNote);
        }

        if (rawNotes.length === 0) {
          notesPreview.textContent = '有効なメロディが検出されませんでした。マイクに少し近づいて歌ってみてください。';
          return;
        }

        // Normalize notes relative to recording start
        let notes = rawNotes.map(n => ({
          ...n,
          start: Math.max(0, n.start)
        }));

        // BPM Grid Quantization
        const quantMode = gridQuantize.value;
        if (quantMode !== 'none') {
          const beatSec = 60.0 / state.bpm;
          let gridSec = beatSec / 2.0; // 8th note default
          if (quantMode === '16th') gridSec = beatSec / 4.0;
          if (quantMode === '4th') gridSec = beatSec;

          notes = notes.map(n => {
            const snappedStart = Math.round(n.start / gridSec) * gridSec;
            const snappedDur = Math.max(gridSec * 0.8, Math.round(n.duration / gridSec) * gridSec);
            return {
              ...n,
              start: snappedStart,
              duration: snappedDur
            };
          });
        }

        // Estimate BPM from intervals
        if (rawNotes.length >= 3) {
          const intervals = [];
          for (let i = 1; i < rawNotes.length; i++) {
            const dt = rawNotes[i].start - rawNotes[i - 1].start;
            if (dt > 0.18) intervals.push(dt);
          }
          if (intervals.length >= 2) {
            intervals.sort((a, b) => a - b);
            const med = intervals[Math.floor(intervals.length / 2)];
            let est = Math.round(60.0 / med);
            while (est < 75) est *= 2;
            while (est > 175) est /= 2;
            state.estimatedBpm = Math.round(est);
            autoBpmPill.textContent = `推定BPM: ${state.estimatedBpm} [適用]`;
            autoBpmPill.style.display = 'inline-block';
          }
        }

        detectedNotes = notes;
        renderPianoRoll();

        statsBadge.textContent = detectedNotes.length + ' ノート';
        btnPlay.disabled = false;
        btnExport.disabled = false;
        notesPreview.textContent = detectedNotes.map(n => `${n.noteName} (${n.duration.toFixed(2)}s)`).join('  ');
      }

      function snapToScale(pitch, mode) {
        const semitone = ((pitch % 12) + 12) % 12;
        const majorScale = [0, 2, 4, 5, 7, 9, 11];
        const minorScale = [0, 2, 3, 5, 7, 8, 10];
        const pentaScale = [0, 3, 5, 7, 10];

        let allowed = null;
        if (mode === 'major') allowed = majorScale;
        else if (mode === 'minor') allowed = minorScale;
        else if (mode === 'pentatonic') allowed = pentaScale;

        if (!allowed || allowed.includes(semitone)) return pitch;

        let bestDiff = 999;
        let bestSnap = pitch;
        for (let s of allowed) {
          let diff = Math.abs(semitone - s);
          if (diff < bestDiff) {
            bestDiff = diff;
            bestSnap = pitch - semitone + s;
          }
        }
        return bestSnap;
      }

      // 4. Render Piano Roll
      function renderPianoRoll(currentPlayheadSec = null) {
        const wrap = document.getElementById('pianoroll-wrap');
        const totalDuration = detectedNotes.length > 0 ? (detectedNotes[detectedNotes.length - 1].start + detectedNotes[detectedNotes.length - 1].duration + 0.5) : 4.0;
        const width = Math.max(wrap.clientWidth, totalDuration * 80);
        pianoCanvas.width = width * window.devicePixelRatio;
        pianoCanvas.height = 180 * window.devicePixelRatio;
        pianoCanvas.style.width = width + 'px';
        pianoCanvas.style.height = '180px';

        const ctx = pianoCtx;
        ctx.save();
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

        const w = width;
        const h = 180;
        ctx.fillStyle = '#15161a';
        ctx.fillRect(0, 0, w, h);

        if (detectedNotes.length === 0) {
          ctx.fillStyle = '#475569';
          ctx.font = '13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('録音完了後にここにピアノロールが表示されます', w / 2, h / 2);
          ctx.restore();
          return;
        }

        const pitches = detectedNotes.map(n => n.pitch);
        const minPitch = Math.min(...pitches) - 2;
        const maxPitch = Math.max(...pitches) + 2;
        const pitchRange = Math.max(12, maxPitch - minPitch + 1);
        const noteHeight = h / pitchRange;

        // Draw pitch rows
        for (let p = minPitch; p <= maxPitch; p++) {
          const y = h - (p - minPitch + 1) * noteHeight;
          const isBlack = [1, 3, 6, 8, 10].includes(((p % 12) + 12) % 12);
          ctx.fillStyle = isBlack ? '#1a1c22' : '#22252e';
          ctx.fillRect(0, y, w, noteHeight - 1);

          if (p % 12 === 0 || p === minPitch || p === maxPitch) {
            ctx.fillStyle = '#64748b';
            ctx.font = '9px monospace';
            ctx.fillText(midiToNoteName(p), 4, y + noteHeight - 3);
          }
        }

        // Draw Beat Grid lines
        const pxPerSec = (w - 20) / Math.max(0.1, totalDuration);
        const beatSec = 60.0 / state.bpm;
        for (let t = 0; t <= totalDuration; t += beatSec) {
          const x = 20 + t * pxPerSec;
          ctx.strokeStyle = '#2d3039';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }

        // Draw Note Blocks
        detectedNotes.forEach(note => {
          const x = 20 + note.start * pxPerSec;
          const noteW = Math.max(4, note.duration * pxPerSec);
          const y = h - (note.pitch - minPitch + 1) * noteHeight;

          const grad = ctx.createLinearGradient(x, y, x + noteW, y);
          grad.addColorStop(0, '#3a86ff');
          grad.addColorStop(1, '#60a5fa');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(x, y + 1, noteW - 2, noteHeight - 3, 3);
          ctx.fill();

          if (noteW > 24) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px monospace';
            ctx.fillText(note.noteName, x + 4, y + noteHeight - 5);
          }
        });

        // Draw Playhead
        if (currentPlayheadSec !== null) {
          const playheadX = 20 + currentPlayheadSec * pxPerSec;
          ctx.strokeStyle = '#f77f00';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(playheadX, 0);
          ctx.lineTo(playheadX, h);
          ctx.stroke();
        }

        ctx.restore();
      }

      // 5. Sound Playback via PCM WAV Blob
      function generateWavBlob(notes, soundType, sampleRate = 44100) {
        if (!notes || notes.length === 0) return null;
        const totalDur = Math.max(...notes.map(n => n.start + n.duration)) + 0.3;
        const totalSamples = Math.floor(totalDur * sampleRate);
        const floatBuf = new Float32Array(totalSamples);

        notes.forEach(note => {
          const freq = midiToFreq(note.pitch);
          const startSample = Math.floor(note.start * sampleRate);
          const durSamples = Math.floor(note.duration * sampleRate);

          for (let i = 0; i < durSamples; i++) {
            const idx = startSample + i;
            if (idx >= totalSamples) break;
            const t = i / sampleRate;
            const progress = i / durSamples;

            let sample = 0;
            if (soundType === 'analog') {
              const env = Math.sin(Math.min(1.0, progress * 4.0) * Math.PI * 0.5) * Math.pow(1.0 - progress * 0.8, 1.2);
              const saw = (2.0 * ((freq * t) % 1.0) - 1.0);
              const sub = Math.sin(2.0 * Math.PI * (freq * 0.5) * t) * 0.4;
              sample = (saw + sub) * env * 0.35;
            } else if (soundType === 'rhodes') {
              const env = Math.exp(-progress * 3.5);
              const tineEnv = Math.exp(-progress * 8.0);
              const sine = Math.sin(2.0 * Math.PI * freq * t);
              const tine = Math.sin(2.0 * Math.PI * (freq * 4.0) * t) * 0.4 * tineEnv;
              sample = (sine + tine) * env * 0.4;
            } else if (soundType === 'brass') {
              const env = Math.min(1.0, progress * 5.0) * Math.pow(1.0 - progress * 0.6, 1.5);
              const saw = (2.0 * ((freq * t) % 1.0) - 1.0);
              const saw2 = (2.0 * (((freq * 1.005) * t) % 1.0) - 1.0);
              sample = (saw + saw2 * 0.5) * env * 0.32;
            } else {
              const env = Math.sin(Math.min(1.0, progress * 3.0) * Math.PI * 0.5) * (1.0 - progress * 0.4);
              const sine = Math.sin(2.0 * Math.PI * freq * t);
              sample = sine * env * 0.4;
            }
            floatBuf[idx] += sample;
          }
        });

        const pcmBytes = new Int16Array(totalSamples);
        for (let i = 0; i < totalSamples; i++) {
          const s = Math.max(-1.0, Math.min(1.0, floatBuf[i]));
          pcmBytes[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        const byteLen = pcmBytes.byteLength;
        const buffer = new ArrayBuffer(44 + byteLen);
        const view = new DataView(buffer);

        function writeString(offset, str) {
          for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        }

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + byteLen, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, byteLen, true);

        const outBytes = new Uint8Array(buffer, 44);
        outBytes.set(new Uint8Array(pcmBytes.buffer));

        return new Blob([buffer], { type: 'audio/wav' });
      }

      async function playSynthesizer() {
        if (detectedNotes.length === 0 || isPlaying) return;
        isPlaying = true;
        btnPlay.classList.add('playing');
        playText.textContent = '停止 (STOP)';

        startMetronome();

        const wavBlob = generateWavBlob(detectedNotes, synthSound.value);
        if (wavBlob) {
          const audioUrl = URL.createObjectURL(wavBlob);
          activeAudioEl = new Audio(audioUrl);
          activeAudioEl.play().catch(e => console.log('Audio element play err:', e));
        }

        const totalDuration = Math.max(...detectedNotes.map(n => n.start + n.duration)) + 0.2;
        const startTimestamp = performance.now();

        function playheadAnim() {
          if (!isPlaying) return;
          const elapsed = (performance.now() - startTimestamp) / 1000;
          renderPianoRoll(elapsed);
          if (elapsed < totalDuration) {
            animId = requestAnimationFrame(playheadAnim);
          } else {
            stopSynthesizer();
          }
        }
        animId = requestAnimationFrame(playheadAnim);
      }

      function stopSynthesizer() {
        isPlaying = false;
        stopMetronome();
        cancelAnimationFrame(animId);
        if (activeAudioEl) {
          try {
            activeAudioEl.pause();
            activeAudioEl.currentTime = 0;
          } catch (e) {}
          activeAudioEl = null;
        }
        btnPlay.classList.remove('playing');
        playText.textContent = 'シンセで再生';
        renderPianoRoll(null);
      }

      // 6. Standard MIDI File (.mid) Generator with Custom BPM
      function writeVLQ(val) {
        let res = [];
        res.push(val & 0x7F);
        val >>= 7;
        while (val > 0) {
          res.push((val & 0x7F) | 0x80);
          val >>= 7;
        }
        res.reverse();
        return res;
      }

      function buildMidiFile(notes, bpm = 120, division = 480) {
        const secPerTick = 60.0 / (bpm * division);
        const rawEvents = [];

        notes.forEach(n => {
          const startTick = Math.round(n.start / secPerTick);
          const endTick = Math.round((n.start + n.duration) / secPerTick);
          rawEvents.push({ tick: startTick, type: 0x90, pitch: n.pitch, vel: n.vel || 95 });
          rawEvents.push({ tick: endTick, type: 0x80, pitch: n.pitch, vel: 0 });
        });

        rawEvents.sort((a, b) => a.tick === b.tick ? (a.type === 0x80 ? -1 : 1) : a.tick - b.tick);

        let trackBytes = [];

        const trackName = "AOI HUM-60 Melody";
        trackBytes.push(0x00, 0xFF, 0x03, trackName.length);
        for (let i = 0; i < trackName.length; i++) trackBytes.push(trackName.charCodeAt(i));

        const mpqn = Math.round(60000000 / bpm);
        trackBytes.push(0x00, 0xFF, 0x51, 0x03, (mpqn >> 16) & 0xFF, (mpqn >> 8) & 0xFF, mpqn & 0xFF);

        let lastTick = 0;
        rawEvents.forEach(ev => {
          const delta = ev.tick - lastTick;
          lastTick = ev.tick;
          trackBytes.push(...writeVLQ(delta));
          trackBytes.push(ev.type, ev.pitch, ev.vel);
        });

        trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

        const header = [
          0x4D, 0x54, 0x68, 0x64,
          0x00, 0x00, 0x00, 0x06,
          0x00, 0x00,
          0x00, 0x01,
          (division >> 8) & 0xFF, division & 0xFF
        ];

        const trackLen = trackBytes.length;
        const trackHeader = [
          0x4D, 0x54, 0x72, 0x6B,
          (trackLen >> 24) & 0xFF,
          (trackLen >> 16) & 0xFF,
          (trackLen >> 8) & 0xFF,
          trackLen & 0xFF
        ];

        return new Uint8Array([...header, ...trackHeader, ...trackBytes]);
      }

      function downloadMidi() {
        if (detectedNotes.length === 0) return;
        const midiBytes = buildMidiFile(detectedNotes, state.bpm, 480);
        const blob = new Blob([midiBytes], { type: 'audio/midi' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `AOI-HUM60-Melody-BPM${state.bpm}.mid`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function loadDemoMelody() {
        detectedNotes = [
          { start: 0.0, duration: 0.4, pitch: 60, noteName: "C4", vel: 95 },
          { start: 0.5, duration: 0.4, pitch: 62, noteName: "D4", vel: 95 },
          { start: 1.0, duration: 0.4, pitch: 64, noteName: "E4", vel: 95 },
          { start: 1.5, duration: 0.5, pitch: 67, noteName: "G4", vel: 100 },
          { start: 2.0, duration: 0.5, pitch: 69, noteName: "A4", vel: 100 },
          { start: 2.5, duration: 0.9, pitch: 67, noteName: "G4", vel: 95 }
        ];
        renderPianoRoll();
        statsBadge.textContent = detectedNotes.length + ' ノート';
        btnPlay.disabled = false;
        btnExport.disabled = false;
        notesPreview.textContent = '【デモメロディ読込済】C4 (0.40s)  D4 (0.40s)  E4 (0.40s)  G4 (0.50s)  A4 (0.50s)  G4 (0.90s)';
        micStatus.textContent = 'MIC: デモ読込完了';
        micStatus.style.color = '#5af0ad';
      }

      // Event Listeners
      btnRec.onclick = triggerRecordAction;

      btnPlay.onclick = () => {
        if (isPlaying) stopSynthesizer();
        else playSynthesizer();
      };

      btnExport.onclick = () => downloadMidi();
      btnDemo.onclick = () => loadDemoMelody();

      scaleSnap.onchange = () => {
        if (recordedFrames.length > 0) processFramesToNotes();
      };

      gridQuantize.onchange = () => {
        if (recordedFrames.length > 0) processFramesToNotes();
      };

      window.addEventListener('resize', () => {
        renderPianoRoll(null);
      });

      renderPianoRoll(null);
    })();
  </script>
